[package]
name = "meridian-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adapter-common = { path = "../adapter-common" }
soroban-sdk = { version = "22.0.0", features = ["alloc"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soroban-sdk = { version = "22.0.0", features = ["testutils", "alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]
