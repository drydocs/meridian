name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the expensive jobs below a push actually needs.
  # Job-level `paths` doesn't exist in Actions, and a workflow-level filter
  # would also skip lint-typecheck and vercel-build. Skipped jobs report as
  # successful, so required checks don't block docs-only PRs.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.filter.outputs.test }}
      e2e: ${{ steps.filter.outputs.e2e }}
      contracts: ${{ steps.filter.outputs.contracts }}
      strategies: ${{ steps.filter.outputs.strategies }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            workspace: &workspace
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/workflows/ci.yml
            test:
              - *workspace
              - "api/**"
              - "apps/web/**"
              - "apps/api-local/**"
              - "apps/strategies/**"
              - "packages/shared/**"
              - "packages/stellar-sdk-helpers/**"
              - "packages/api-core/**"
              - "packages/strategies/**"
              - "packages/sdk/**"
              - "!**/*.md"
            e2e:
              - *workspace
              - "api/**"
              - "apps/web/**"
              - "apps/api-local/**"
              - "apps/strategies/**"
              - "packages/shared/**"
              - "packages/stellar-sdk-helpers/**"
              - "packages/api-core/**"
              - "!**/*.md"
            docs:
              - "**/*.md"
              - "apps/docs/**"
              - lychee.toml
              - .markdownlint.json
              - .markdownlint-cli2.jsonc
              - .github/workflows/ci.yml
            contracts:
              - .github/workflows/ci.yml
              - "packages/contracts/**"
              - "scripts/check-wasm-size.ts"
              - "packages/shared/src/wasm-size-budget.ts"
              - "scripts/deploy-*.sh"
              - "scripts/redeploy-*.sh"
              - "scripts/lib/**"
              - "!**/*.md"
            strategies:
              - *workspace
              - "packages/strategies/**"
              - "packages/shared/**"
              - "packages/stellar-sdk-helpers/**"
              - "!**/*.md"

  lint-typecheck:
    permissions:
      contents: read
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify apps/api-local build output is flat
        run: |
          pnpm --filter @meridian/api-local build
          test -f apps/api-local/dist/index.js

  vercel-build:
    permissions:
      contents: read
    name: Verify Vercel Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the real Vercel build script
        run: pnpm exec bash scripts/build-vercel.sh
      - name: Assert every workspace package api/v1/* imports was bundled
        run: |
          for pkg in shared stellar-sdk-helpers api-core; do
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "::error::packages/$pkg/dist/index.js was not produced by scripts/build-vercel.sh, but api/v1/* imports @meridian/$pkg. This is the exact failure mode from #398 (ERR_MODULE_NOT_FOUND in production)."
              exit 1
            fi
          done
      - name: Check web bundle budget
        run: pnpm bundle:check

  # Markdown lint plus link checks for the README, root docs and `apps/docs`.
  # Internal links are strict; external links are best-effort on PRs (hosts
  # that block CI are allowlisted in lychee.toml).
  docs-checks:
    name: Docs Lint & Links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee
      - name: Lint Markdown
        run: pnpm lint:md
      - name: Check internal links
        run: pnpm check:links
      - name: Check external links
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # An authenticated request keeps github.com links from being rejected
        # with 503 once the runner is rate limited.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:links:external

  test:
    permissions:
      contents: read
    name: Test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm coverage
      - name: Run strategies example smoke test
        if: needs.changes.outputs.strategies == 'true'
        run: |
          pnpm exec turbo run build --filter=@meridian/strategies...
          # pnpm prints a `> package script` banner before the script output, so
          # keep only the JSON object the example writes.
          summary="$(pnpm --filter @meridian/strategies example | sed -n '/^{/,$p')"
          printf '%s\n' "$summary"
          node -e '
            const s = JSON.parse(process.argv[1]);
            const required = ["strategy", "seed", "assets", "ticks", "initialCash", "finalValue", "strategyEquity", "pnl", "totalFees", "totalInterest", "totalFunding"];
            for (const key of required) {
              if (!(key in s)) throw new Error(`Missing summary field: ${key}`);
            }
            if (s.strategy !== "target-weight@1.0.0") throw new Error(`Unexpected strategy: ${s.strategy}`);
            if (typeof s.ticks !== "number" || s.ticks <= 0) throw new Error(`Invalid ticks: ${s.ticks}`);
            if (!/^-?\d+(\.\d+)?$/.test(s.finalValue)) throw new Error(`Malformed finalValue: ${s.finalValue}`);
          ' "$summary"

  commitlint:
    permissions:
      contents: read
      pull-requests: read
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  dependency-review:
    permissions:
      contents: read
      pull-requests: read
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  e2e:
    permissions:
      contents: read
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Drives the real dev stack against real Stellar testnet RPC (wallet
    # signing is mocked, see apps/web/e2e/fixtures.ts), so it exercises
    # the real API and Soroban simulation paths end to end. Tests use page.route()
    # to stub live-network-dependent data where it would otherwise be flaky on
    # testnet RPC hiccups (see #535). Not a required check (#1036).
    #
    # STELLAR_NETWORK must be set explicitly: mainnet is now the default
    # (packages/shared/src/constants.ts, #738) since the product is live
    # there, and this suite's testnet assumptions (testnet contract
    # addresses, mocked-wallet fixtures funded on testnet) would otherwise
    # silently target mainnet instead.
    env:
      STELLAR_NETWORK: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api-local imports its workspace deps (@meridian/shared etc.) by
      # package resolution, which needs their dist/ output built first - the
      # dev server doesn't build them itself. Scoped to api-local's own
      # dependency graph so this doesn't also try to build contracts/docs.
      - run: pnpm exec turbo run build --filter=@meridian/api-local...
      - run: pnpm --filter @meridian/web exec playwright install --with-deps chromium
      - run: pnpm --filter @meridian/web test:e2e

  contracts:
    permissions:
      contents: read
    name: Soroban Contract Tests
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The WASM size check builds the PR's base commit for its delta.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.100.0
          targets: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/contracts
      - name: Check formatting
        working-directory: packages/contracts
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: packages/contracts
        run: cargo clippy --all-targets -- -D warnings
      # Real vault + real mUSDC + real Blend adapter + a mock Blend pool,
      # under enforcing authorization (packages/contracts/integration-tests).
      # The coverage step below also runs these, but a named step makes a
      # cross-contract regression attributable at a glance.
      - name: Run cross-contract integration tests
        working-directory: packages/contracts
        run: cargo test --locked -p meridian-integration-tests
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d8c10dae823f48238abff23fee4146b448aed2f1 # cargo-llvm-cov
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Measure contract coverage
        working-directory: packages/contracts
        run: >-
          cargo llvm-cov
          --workspace
          --summary-only
          --fail-under-lines 97.5
      - name: Run Soroban resource benchmarks
        working-directory: packages/contracts
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee benchmark-output.log
      - name: Build wasm
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release
      # Compares each contract's release WASM with its budget in
      # packages/contracts/wasm-size-budgets.json and, on PRs, with a build of
      # the base commit (same command, separate target dir). Fails when a
      # contract is over budget; the table also goes to the job summary.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check contract WASM size budgets
        env:
          WASM_SIZE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:wasm-size
      - name: Gate Soroban resource benchmarks
        run: >
          pnpm check:contract-benchmarks
          --input packages/contracts/benchmark-output.log
          --baseline packages/contracts/benchmarks/baselines.json
          --output packages/contracts/benchmark-results.json
      - name: Upload Soroban benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soroban-resource-benchmarks
          path: |
            packages/contracts/benchmark-results.json
            packages/contracts/benchmark-output.log
          if-no-files-found: warn
