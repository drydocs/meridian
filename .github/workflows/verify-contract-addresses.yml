name: Verify Contract Addresses

# Guards against a specific supply-chain risk: a PR can submit clean,
# reviewable contract source while pointing a contract address at different,
# unreviewed bytecode the contributor deployed themselves.
#
# The vault is immutable on-chain, so an unchanged address always holds the
# same reviewed bytecode. A fast planning step decides whether this PR actually
# changes a recorded address; only then does it install the Soroban toolchain,
# rebuild from source, and compare against the chain. PRs that touch these
# files without moving an address pass without the slow build.
#
# Every PR must report this job, including PRs unrelated to contract addresses.
# Filtering the workflow itself leaves a required status pending indefinitely.
# Enforcement is configured separately: after this workflow is merged, a repo
# admin must add "Verify On-Chain Bytecode" to main's required status checks
# (see #1067). A failing job alone does not enable branch protection.
on:
  pull_request: {}
  workflow_dispatch: {}

# One run per PR at a time. A new push cancels any in-progress run on the
# same branch so stale results never gate a merge.
concurrency:
  group: verify-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify On-Chain Bytecode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Preserve failures so branch protection can enforce this check.
    continue-on-error: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The planning step diffs this PR against its base commit to decide
          # whether a recorded address changed, so it needs full history.
          fetch-depth: 0
      - name: Detect verification changes
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            verification:
              - "packages/shared/src/constants.ts"
              - "packages/shared/deployed-contracts.json"
              - "packages/stellar-sdk-helpers/src/known-pools.ts"
              - "scripts/verify-contract-addresses.ts"
              - ".github/workflows/verify-contract-addresses.yml"
      - name: No verification changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.verification == 'false'
        run: echo "No contract address or verification changes; verification is not needed."
      - uses: pnpm/action-setup@v6.1.0
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.verification == 'true'
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.verification == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.verification == 'true'
      - name: Plan verification
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.verification == 'true'
        # Decides pass / fail / build from the deploy record, CONTRACT_ADDRESSES,
        # and what this PR changed. Fails fast here on any address disagreement,
        # before any toolchain is installed. Sets needs_build for the steps
        # below.
        id: plan
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:contracts -- --plan
      - name: Read pinned Stellar CLI version
        # The build path must reproduce the recorded bytecode, so it pins the
        # exact stellar-cli version the deploy record names rather than
        # resolving whatever is latest. Compiling identical source with a
        # different CLI version yields a different wasm hash.
        if: steps.plan.outputs.needs_build == 'true'
        id: stellar-cli-version
        run: |
          VERSION=$(jq -r '.toolchain.stellarCli' packages/shared/deployed-contracts.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to read toolchain.stellarCli from deployed-contracts.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.needs_build == 'true'
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.needs_build == 'true'
        with:
          workspaces: packages/contracts
      - name: Cache Stellar CLI binary
        if: steps.plan.outputs.needs_build == 'true'
        id: cache-stellar-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ steps.stellar-cli-version.outputs.version }}
      - name: Install Stellar CLI build dependencies
        # stellar-cli pulls in libdbus-sys and hidapi (hardware wallet
        # support) transitively, which need the dbus-1 and libudev system
        # libraries at build time; not preinstalled on ubuntu-latest runners.
        if: steps.plan.outputs.needs_build == 'true' && steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - name: Install Stellar CLI
        if: steps.plan.outputs.needs_build == 'true' && steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version "${{ steps.stellar-cli-version.outputs.version }}"
      - name: Verify contract addresses match on-chain bytecode
        # Only runs when the plan found a changed address. The script retries
        # transient Soroban RPC failures internally (3 attempts, 3 s apart).
        # Exit code is non-zero on any mismatch.
        if: steps.plan.outputs.needs_build == 'true'
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:contracts -- --verify
