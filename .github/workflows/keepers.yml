name: Keepers Schedule

# GitHub Actions' native cron scheduler can silently drop ticks during high
# load periods (e.g., top-of-hour), causing gaps in keeper execution. To
# ensure reliability, we replace the native schedule trigger with an external
# pinger that guarantees timely execution.
#
# The external pinger calls the GitHub API to trigger this workflow via
# workflow_dispatch, ensuring that each keeper runs on its intended cadence
# without relying on GitHub's unreliable cron implementation.
on:
  workflow_dispatch:
    inputs:
      keeper:
        description: "Which keeper to run"
        required: true
        type: choice
        options:
          - alert
          - accrue
          - rebalance

jobs:
  trigger-keepers:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert keeper
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.keeper == 'alert'
        run: |
          curl -sf -X POST "${{ vars.API_BASE_URL }}/api/v1/keepers/alert" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Trigger accrual keeper
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.keeper == 'accrue'
        run: |
          curl -sf -X POST "${{ vars.API_BASE_URL }}/api/v1/keepers/accrue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Trigger migration keeper
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.keeper == 'rebalance'
        run: |
          curl -sf -X POST "${{ vars.API_BASE_URL }}/api/v1/keepers/rebalance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
